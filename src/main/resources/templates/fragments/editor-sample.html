<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="editor-sample">
<div id="editor-sample" class="editor-sample" title="サンプル一覧">
  <label for="sample-select" class="sample-label">サンプル:</label>
  <select id="sample-select" name="sample-select" class="select select-bordered select-xs" title="サンプル一覧">
    <option value="" disabled selected>サンプルを選択...</option>
    <option th:each="sample : ${samples}" th:value="${sample.filename}" th:text="${sample.name}" th:attr="data-code=${sample.code}"></option>
  </select>
</div>
</th:block>
</body>
</html>
