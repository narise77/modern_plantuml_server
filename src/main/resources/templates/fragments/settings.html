<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="settings">
<div id="settings" class="modal" style="display: none;" tabindex="-1">
  <div class="modal-content flex-rows rounded-box shadow-xl border border-base-300">
    <div class="modal-header flex items-center gap-2 pb-3 mb-3 border-b border-base-300">
      <!-- Heroicons: cog-6-tooth -->
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
      </svg>
      <h2 class="text-lg font-bold">Settings</h2>
    </div>
    <div class="modal-main flex-main flex flex-col gap-3">
      <fieldset class="fieldset">
        <label class="fieldset-legend" for="theme">Theme</label>
        <select class="select select-sm w-full" id="theme" name="theme">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </fieldset>
      <fieldset class="fieldset">
        <label class="fieldset-legend" for="diagramPreviewType">Diagram Preview Type</label>
        <select class="select select-sm w-full" id="diagramPreviewType" name="diagramPreviewType">
          <option value="png">PNG</option>
          <option value="svg">SVG</option>
          <option value="txt">ASCII Art</option>
        </select>
      </fieldset>
      <fieldset class="fieldset">
        <label class="fieldset-legend" for="editorWatcherTimeout">Editor Watcher Timeout</label>
        <input class="input input-sm w-full" id="editorWatcherTimeout" type="number" pattern="[1-9]+[0-9]*" value="" />
      </fieldset>
      <fieldset class="fieldset flex-main">
        <label class="fieldset-legend" for="editorCreateOptions">Monaco Editor Create Options</label>
        <div id="settings-monaco-editor" class="rounded-box border border-base-300 overflow-hidden"></div>
      </fieldset>
    </div>
    <div class="modal-footer flex justify-end gap-2 pt-3 mt-3 border-t border-base-300">
      <input class="cancel btn btn-ghost btn-sm" type="button" value="Cancel" onclick="closeModal('settings');" />
      <input id="settings-ok-btn" class="ok btn btn-primary btn-sm" type="button" value="Save" />
    </div>
  </div>
</div>
</th:block>
</body>
</html>
