<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="dpi-select">
<div class="dpi-select">
  <label class="select select-sm">
    <span class="label">DPI</span>
    <select id="dpi-select">
      <option value="">72 (default)</option>
      <option value="150">150</option>
      <option value="300">300</option>
    </select>
  </label>
</div>
</th:block>
</body>
</html>
