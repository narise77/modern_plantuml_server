<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="app-head">
<base th:href="${contextPath + '/'}" />
<meta charset="utf-8" />
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta http-equiv="expires" content="0" />
<meta http-equiv="pragma" content="no-cache" />
<meta http-equiv="cache-control" content="no-cache, must-revalidate" />
<meta name="viewport" content="initial-scale=1.0, user-scalable=1" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="favicon.ico" type="image/x-icon"/>
<link rel="shortcut icon" th:href="@{/favicon.ico}" type="image/x-icon"/>
<link rel="apple-touch-icon" sizes="152x152" th:href="@{/apple-touch-icon.png}" />
<!-- daisyUI (Tailwind CSS) -->
<!-- daisyUI 5.7.47 / @tailwindcss/browser 4.3.3 (downloaded from cdn.jsdelivr.net) -->
<link rel="stylesheet" href="vendor/daisyui/daisyui.css" />
<script src="vendor/tailwindcss/browser.global.js"></script>
<link rel="stylesheet" href="min/plantuml.min.css" />
<script src="min/plantuml.min.js"></script>
<script src="min/plantuml-language.min.js"></script>
<script src="webjars/monaco-editor/0.36.1/min/vs/loader.js"></script>

</body>
</html>
