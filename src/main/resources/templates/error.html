<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <base th:href="${contextRoot}" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="cache-control" content="no-cache, must-revalidate" />
    <link rel="stylesheet" href="plantuml.css" type="text/css"/>
    <link rel="icon" href="favicon.ico" type="image/x-icon"/>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon"/>
    <title>PlantUMLServer Error</title>
</head>
<body>
    <p>
        Sorry, but things didn't work out as planned.
    </p>
    <hr/>
    <ul>
        <li th:text="${now}"></li>
        <li>Request that failed: <code th:text="${requestUri}"></code></li>
        <li>Status code: <code th:text="${statusCode}"></code></li>
        <li>Message: <code th:text="${message}"></code></li>
        <li>Exception: <code th:text="${exception}"></code></li>
    </ul>
    <hr/>
</body>
</html>
