spring.application.name=plantuml
server.port=${PLANTUML_SERVER_PORT:6080}

server.servlet.context-path=${PLANTUML_SERVER_CONTEXTPATH:/plantuml}
server.servlet.session.timeout=1m
server.servlet.encoding.charset=UTF-8

# font directory path (defaults to OS fonts if not set or not existing)
plantuml.font-path=${FONT_PATH:}

# sample diagrams directory path (defaults to classpath:/static/sample if not set or not existing)
plantuml.sample-path=${SAMPLE_PATH:}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# diagram upload for /metadata
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
